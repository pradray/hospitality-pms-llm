#607D8B" stroke-width="1.5" marker-end="url(#ar)"/><rect x="200" y="714" width="540" height="86" rx="5" fill="#E8EAF6" stroke="#1A237E" stroke-width="1.5"/><text x="470" y="735" font-family="'Courier New', monospace" font-size="12.5" font-weight="400" fill="#1A237E" text-anchor="middle" style="">_build_user_prompt()</text><text x="470" y="753" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#1A237E" text-anchor="middle" style="">per chunk → [Source i: source_file — section] + chunk text</text><text x="470" y="770" font-family="'Courier New', monospace" font-size="10" font-weight="400" fill="#1A237E" text-anchor="middle" style="">joined by '---'  →  "Context:\n{...}\n\nQuestion: {q}"</text><text x="470" y="789" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#1A237E" text-anchor="middle" style="font-style:italic;">no chunks (base configs) → prompt = raw query</text><line x1="470" y1="800" x2="470" y2="818" stroke="#607D8B" stroke-width="1.5" marker-end="url(#ar)"/><rect x="200" y="818" width="540" height="54" rx="5" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/><text x="470" y="838" font-family="'Courier New', monospace" font-size="11.5" font-weight="400" fill="#37474F" text-anchor="middle" style="">system = SYSTEM_PROMPT_RAG</text><text x="470" y="856" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#37474F" text-anchor="middle" style="">ground in context · admit if insufficient · HTTP method + full path · exact OPERA Control</text><line x1="470" y1="872" x2="470" y2="890" stroke="#607D8B" stroke-width="1.5" marker-end="url(#ar)"/><rect x="230" y="890" width="480" height="72" rx="5" fill="#E8EAF6" stroke="#1A237E" stroke-width="1.5"/><text x="470" y="912" font-family="'Courier New', monospace" font-size="12.5" font-weight="400" fill="#1A237E" text-anchor="middle" style="">_generate() · llama.cpp</text><text x="470" y="930" font-family="'Courier New', monospa