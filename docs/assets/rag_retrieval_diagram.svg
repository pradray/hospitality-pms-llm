anchor="middle" style="">8,781 × 384-dim · cosine HNSW index</text><text x="470" y="309" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="400" fill="#004D40" text-anchor="middle" style="">metadata: module · doc_type · source_file · section · method · path</text><polyline points="255,300 100,300 100,590 228,590" fill="none" stroke="#607D8B" stroke-width="1.5" marker-end="url(#ar)"/><text x="108" y="430" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#546E7A" text-anchor="start" style="">vector</text><text x="108" y="444" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#546E7A" text-anchor="start" style="">search</text><text x="108" y="458" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#546E7A" text-anchor="start" style="font-style:italic;">(top-5 NN)</text><line x1="470" y1="320" x2="470" y2="346" stroke="#607D8B" stroke-width="1.5" marker-end="url(#ar)"/><rect x="300" y="346" width="340" height="50" rx="5" fill="#ECEFF1" stroke="#607D8B" stroke-width="1.5"/><text x="470" y="366" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#37474F" text-anchor="middle" style="">RAGPipeline.retrieve() — guard</text><text x="470" y="384" font-family="'Courier New', monospace" font-size="9.5" font-weight="400" fill="#37474F" text-anchor="middle" style="">if not use_rag: return []   (3B/7B-base skip retrieval)</text><line x1="470" y1="396" x2="470" y2="416" stroke="#607D8B" stroke-width="1.5" marker-end="url(#ar)"/><rect x="270" y="416" width="400" height="56" rx="5" fill="#E8EAF6" stroke="#1A237E" stroke-width="1.5"/><text x="470" y="438" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1A237E" text-anchor="middle" style="">embed query</text><text x="470" y="456" font-family="'Courier New', monospace" font-size="10" font-weight="400" fill="#1A237E" text-anchor="middle" style="">embedder.en